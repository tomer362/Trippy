name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Fails when the schema and the migrations have drifted apart, which otherwise only
      # shows up as a missing column at runtime on a freshly provisioned database.
      - run: pnpm exec drizzle-kit check
      - run: pnpm build

  # The app talks to Postgres through Neon's HTTP driver, which cannot speak to a plain
  # Postgres service container — so this needs a real (throwaway) Neon branch. Without the
  # secret the job skips rather than failing, so a fresh clone or fork still goes green.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && vars.RUN_E2E == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      AUTH_TEST_BYPASS: "1"
      BETTER_AUTH_SECRET: e2e-secret-not-used-anywhere-real
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Needs no Google keys: destination search falls back to the curated table.
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
